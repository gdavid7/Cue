name: Skill links

on:
  push:
    paths:
      - ".claude/skills/**"
      - "scripts/check-skill-links.mjs"
      - ".github/workflows/skill-links.yml"
  pull_request:
    paths:
      - ".claude/skills/**"
      - "scripts/check-skill-links.mjs"
      - ".github/workflows/skill-links.yml"

permissions:
  contents: read

jobs:
  check:
    name: Relative links in .claude/skills resolve
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check-skill-links.mjs
