name: Run Tests

permissions:
  contents: read

on:
  # Agent branches get CI from their pull request; pushing them too ran it twice.
  push:
    branches: [claude/upbeat-sagan-6c5ed8, production]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
  pull_request:
    branches: [claude/upbeat-sagan-6c5ed8, production, "claude/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Shard 1 (unit + database tests) runs close to 10 minutes and was cancelled after passing.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Check PR monitor failure reporting
        if: matrix.shard == 1
        run: node --test .claude/skills/pr-watch/pr-digest.test.mjs

      - name: Run lint check
        if: matrix.shard == 1
        run: pnpm check

      - name: Type check packages
        if: matrix.shard == 1
        run: pnpm typecheck:packages

      - name: Check structural conventions
        if: matrix.shard == 1
        run: pnpm konsistent

      - name: Check Prisma enum imports
        if: matrix.shard == 1
        run: pnpm -F inbox-zero-ai check-enums

      - name: Check server action exports
        if: matrix.shard == 1
        run: pnpm -F inbox-zero-ai check-server-actions

      - name: Check client redirects
        if: matrix.shard == 1
        run: pnpm -F inbox-zero-ai check-client-redirects

      - name: Check test fixture hygiene
        if: matrix.shard == 1
        run: pnpm -F inbox-zero-ai check-test-fixtures

      - name: Run tests
        run: pnpm -F inbox-zero-ai test --run --shard=${{ matrix.shard }}/2
        env:
          RUN_AI_TESTS: false
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          AUTH_SECRET: "secret"
          GOOGLE_CLIENT_ID: "client_id"
          GOOGLE_CLIENT_SECRET: "client_secret"
          MICROSOFT_CLIENT_ID: "client_id"
          MICROSOFT_CLIENT_SECRET: "client_secret"
          GOOGLE_PUBSUB_TOPIC_NAME: "topic"
          EMAIL_ENCRYPT_SECRET: "secret"
          EMAIL_ENCRYPT_SALT: "salt"
          INTERNAL_API_KEY: "secret"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"

      - name: Run package tests
        if: matrix.shard == 1
        run: pnpm test:packages

      - name: Run database tests
        if: matrix.shard == 1
        timeout-minutes: 5
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:15
          until docker exec postgres pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          pnpm -F inbox-zero-ai exec prisma migrate deploy
          pnpm -F inbox-zero-ai test-db __tests__/db/shared-conversations.test.ts
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          AUTH_SECRET: "secret"
          GOOGLE_CLIENT_ID: "client_id"
          GOOGLE_CLIENT_SECRET: "client_secret"
          MICROSOFT_CLIENT_ID: "client_id"
          MICROSOFT_CLIENT_SECRET: "client_secret"
          GOOGLE_PUBSUB_TOPIC_NAME: "topic"
          EMAIL_ENCRYPT_SECRET: "secret"
          EMAIL_ENCRYPT_SALT: "salt"
          INTERNAL_API_KEY: "secret"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"

      - name: Run integration tests
        if: matrix.shard == 1
        run: pnpm -F inbox-zero-ai test-integration
        env:
          RUN_INTEGRATION_TESTS: true
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          AUTH_SECRET: "secret"
          GOOGLE_CLIENT_ID: "client_id"
          GOOGLE_CLIENT_SECRET: "client_secret"
          MICROSOFT_CLIENT_ID: "client_id"
          MICROSOFT_CLIENT_SECRET: "client_secret"
          GOOGLE_PUBSUB_TOPIC_NAME: "topic"
          EMAIL_ENCRYPT_SECRET: "secret"
          EMAIL_ENCRYPT_SALT: "salt"
          INTERNAL_API_KEY: "secret"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"

  # The local mail quota Lua runs against a real redis-server here; the suite
  # starts its own (docker run redis:7, or /usr/bin/redis-server), so it needs
  # no service container. Its own job keeps shard 1 inside its timeout.
  redis-lua:
    name: Redis Lua
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Retry the apt install so a stalled mirror fails fast instead of eating the job.
      - name: Install redis-server
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends redis-server && break
            sleep 5
          done
          test -x /usr/bin/redis-server
      - name: Run Redis Lua tests
        timeout-minutes: 5
        run: pnpm -F inbox-zero-ai exec vitest run --dir __tests__/redis
        env:
          RUN_INTEGRATION_TESTS: true
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          AUTH_SECRET: "secret"
          GOOGLE_CLIENT_ID: "client_id"
          GOOGLE_CLIENT_SECRET: "client_secret"
          MICROSOFT_CLIENT_ID: "client_id"
          MICROSOFT_CLIENT_SECRET: "client_secret"
          GOOGLE_PUBSUB_TOPIC_NAME: "topic"
          EMAIL_ENCRYPT_SECRET: "secret"
          EMAIL_ENCRYPT_SALT: "salt"
          INTERNAL_API_KEY: "secret"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"

  electron:
    name: Electron mail runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAIL_REQUIRE_ELECTRON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron runtime
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - name: Install runtime libraries
        timeout-minutes: 15
        run: $GITHUB_WORKSPACE/.github/scripts/install-with-retry.sh pnpm -F inbox-zero-ai exec playwright install-deps chromium
      - name: Test actual Electron processes and SQLite
        run: xvfb-run -a pnpm -F @inboxzero/desktop test
