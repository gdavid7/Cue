<!doctype html>
<html lang="en" data-theme="mail">
  <head>
    <meta charset="utf-8">
    <title>Inbox Zero Mail</title>
    <script>
      // Follows the OS theme before the first paint, and live after it.
      const darkScheme = matchMedia("(prefers-color-scheme: dark)");
      const applyScheme = () => {
        document.documentElement.classList.toggle("dark", darkScheme.matches);
        document.documentElement.style.colorScheme = darkScheme.matches
          ? "dark"
          : "light";
      };
      applyScheme();
      darkScheme.addEventListener("change", applyScheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
