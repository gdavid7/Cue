<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cue</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233a5bd9'/%3E%3Cpath d='M20.5 11.5a6.5 6.5 0 1 0 0 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true">c</span>
      <span class="brand-name">Cue</span>
    </a>
    <div class="accounts" id="accounts" aria-label="Connected accounts"></div>
    <div class="topbar-right">
      <span class="metric" id="metric" title="Times Cue found something so you didn't have to search another app"></span>
      <span class="brain" id="brain"></span>
      <button class="ghost" id="open-drawer" aria-controls="drawer">Settings &amp; activity</button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2>Settings &amp; activity</h2>
      <button class="ghost" id="close-drawer" aria-label="Close">✕</button>
    </div>
    <section>
      <h3>What Cue may do on its own</h3>
      <p class="muted">Only private, reversible actions can run automatically. Anything that sends mail always waits for you.</p>
      <div id="rules"></div>
    </section>
    <section>
      <h3>Reminders</h3>
      <ul id="reminders" class="plain"></ul>
    </section>
    <section>
      <h3>Activity log</h3>
      <ul id="audit" class="plain audit"></ul>
    </section>
  </aside>

  <script src="app.js" type="module"></script>
</body>
</html>
